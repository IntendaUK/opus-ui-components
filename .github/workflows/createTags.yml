name: Test, Build, Publish, and Tag

on:
  push:
    branches:
      - opus-2

permissions:
  contents: write
  id-token: write

jobs:
  build-publish-tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Get package version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detected version: $VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Build project
        run: npm run build

      - name: Publish to npm
        run: |
          echo "Publishing version $VERSION to npm with the opus-2 tag..."
          npm publish --tag opus-2

      - name: Create and push tag if not exists
        env:
          PACKAGE_VERSION: ${{ env.VERSION }}
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          if git tag --list "v${PACKAGE_VERSION}" | grep -q "v${PACKAGE_VERSION}"; then
            echo "Tag v${PACKAGE_VERSION} already exists. Doing nothing."
          else
            echo "Creating tag v${PACKAGE_VERSION}"
            git tag -a "v${PACKAGE_VERSION}" -m "v${PACKAGE_VERSION}"
            git push origin "v${PACKAGE_VERSION}"
          fi
